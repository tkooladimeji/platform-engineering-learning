name: stockroom

services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    environment:
      ENABLE_TELEMETRY: "false"
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:1234:1234"
      - "127.0.0.1:18082:8080"
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      COSMOS_ENDPOINT: http://cosmos:8081
      COSMOS_DATABASE: stockroom
    depends_on:
      cosmos:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      COSMOS_ENDPOINT: http://cosmos:8081
      COSMOS_DATABASE: stockroom
    depends_on:
      cosmos:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4002/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - CATALOG_URL=http://catalog:4001
      - INVENTORY_URL=http://inventory:4002
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
    networks:
      default:
        aliases:
          - stockroom-gateway
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  cosmos-data: