apiVersion: v1
kind: Service
metadata:
  name: cosmos
  namespace: stockroom
spec:
  clusterIP: None
  selector:
    app: cosmos
  ports:
    - name: api
      port: 8081
      targetPort: api
    - name: explorer
      port: 1234
      targetPort: explorer
    - name: health
      port: 8080
      targetPort: health
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cosmos
  namespace: stockroom
spec:
  serviceName: cosmos
  replicas: 1
  selector:
    matchLabels:
      app: cosmos
  template:
    metadata:
      labels:
        app: cosmos
    spec:
      containers:
        - name: cosmos
          image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENABLE_TELEMETRY
              value: "false"
          ports:
            - name: api
              containerPort: 8081
            - name: explorer
              containerPort: 1234
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
