apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: stockroom
spec:
  type: ClusterIP
  selector:
    app: inventory
  ports:
    - name: http
      port: 4002
      targetPort: 4002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: stockroom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      initContainers:
        - name: wait-for-cosmos
          image: stockroom-inventory:local-cosmos-v1
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              async function wait() {
                for (let attempt = 0; attempt < 60; attempt++) {
                  try {
                    const response = await fetch("http://cosmos:8080/ready", {
                      signal: AbortSignal.timeout(3000),
                    });
                    if (response.ok) return;
                    console.error(`Cosmos is not ready: HTTP ${response.status}`);
                  } catch (error) {
                    console.error("Waiting for Cosmos:", error.message);
                  }
                  await new Promise(resolve => setTimeout(resolve, 3000));
                }
                throw new Error("Cosmos did not become ready before the startup deadline");
              }
              wait().catch(error => { console.error(error); process.exit(1); });
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      containers:
        - name: inventory
          image: stockroom-inventory:local-cosmos-v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cosmos-config
          ports:
            - name: http
              containerPort: 4002
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2